
name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

      - name: Publish application
        run: dotnet publish CICDDemo/CICDDemo.csproj --configuration Release --no-build --output ./publish

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicddemo-app
          path: ./publish/

      - name: Report pipeline result
        if: always()
        run: |
          echo "================================="
          echo "CI/CD PIPELINE FINISHED"
          echo "Status: ${{ job.status }}"
          echo "================================="